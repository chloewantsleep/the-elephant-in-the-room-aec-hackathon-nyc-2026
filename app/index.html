<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Elephant in the Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="floating-chat.css">
</head>
<body class="conversation-workspace">
  <main id="stage">
    <!-- The list panels live beside the room view; opening them pushes the view aside instead of covering it. -->
    <aside id="drawer" class="drawer" aria-label="Shopping list"></aside>
    <section id="cartx" class="cartx" aria-label="Everything in your room"></section>

    <div id="view">
      <!-- The photo is the interface: your room, later replaced by the AI render. -->
      <img id="room" src="assets/example-lounge.jpg" alt="Room">
      <div id="shade"></div>
      <div id="measure" hidden></div>
      <div id="boxes"></div>
      <div id="hotspots"></div>

      <div class="frame">
        <div class="brand">The Elephant in the Room</div>
        <div id="topbar" class="topbar" hidden></div>
        <button id="mode" class="mock-tag" data-action="live" title="Switch between demo renders and live AI renders"></button>

        <button class="side side-left" id="back" data-action="back"></button>
        <button class="side side-right" id="next" data-action="next"></button>

        <section id="panel"></section>
        <nav id="rail" class="rail" hidden aria-label="Shortcuts"></nav>

        <nav id="steps" class="pill-row" aria-label="Pipeline steps"></nav>
        <button class="round-btn" data-action="labels" title="Show / hide labels" aria-label="Show or hide labels">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/><path d="M8.5 11h5"/></svg>
        </button>
      </div>
    </div>
    <div id="toast" class="pill pill-static" hidden></div>
  </main>
  <input id="context-file" type="file" accept="image/*" hidden>
  <input id="file" type="file" accept="image/*" hidden>
  <script src="sofa-matcher.js"></script>
  <script src="brief-engine.js"></script>
  <script src="layout-engine.js"></script>
  <script src="designer.js"></script>
  <script src="sofa-ui.js"></script>
  <script src="app.js"></script>
  <script src="docked-chat.js"></script>
  <script src="design-workflow.js"></script>
</body>
</html>
