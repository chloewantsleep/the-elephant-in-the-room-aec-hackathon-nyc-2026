<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Elephant in the Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="floating-chat.css">
</head>
<body>
  <!-- first screen: the elephant draws itself, then flies to the logo spot and the room appears (intro.js) -->
  <div id="intro" aria-hidden="true">
    <svg class="intro-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path pathLength="1" d="M3 17v-5c0-3.5 3-6 6.5-6H13c3.9 0 7 3 7 7v3.5c0 1.1.9 2 2 2"/><path pathLength="1" d="M3 17h12.5M6 17v3M10 17v3M15 16v4"/>
      <path pathLength="1" d="M13 8.5c-1.6.5-2.1 2.6-1 4.2.9 1.2 3 1.1 3.5-.3"/><circle cx="17.2" cy="10.4" r=".6" fill="currentColor" stroke="none"/></svg>
    <p class="intro-name">The Elephant in the Room</p>
  </div>
  <main id="stage">
    <img id="backdrop" src="assets/example-lounge-wide.jpg" alt="" aria-hidden="true">
    <!-- The list panels live beside the room view; opening them pushes the view aside instead of covering it. -->
    <aside id="drawer" class="drawer" aria-label="Shopping list"></aside>
    <section id="cartx" class="cartx" aria-label="Everything in your room"></section>

    <div id="view">
      <!-- The photo is the interface: your room, later replaced by the AI render. -->
      <img id="room" src="assets/example-lounge-wide.jpg" alt="Room">
      <div id="shade"></div>
      <div id="measure" hidden></div>
      <div id="boxes"></div>
      <div id="hotspots"></div>
      <canvas id="sketch" hidden aria-label="Sketch layer: draw on the room"></canvas>

      <div class="frame">
        <button id="skfab" class="sk-fab" data-sk="enter" hidden aria-label="Sketch furniture"></button>
        <div class="brand" role="img" aria-label="The Elephant in the Room" title="The Elephant in the Room"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 17v-5c0-3.5 3-6 6.5-6H13c3.9 0 7 3 7 7v3.5c0 1.1.9 2 2 2"/><path d="M3 17h12.5M6 17v3M10 17v3M15 16v4"/>
          <path d="M13 8.5c-1.6.5-2.1 2.6-1 4.2.9 1.2 3 1.1 3.5-.3"/><circle cx="17.2" cy="10.4" r=".6" fill="currentColor"/></svg></div>
        <div id="topbar" class="topbar" hidden></div>


        <section id="panel"></section>
        <section id="sketchbar" hidden aria-label="Sketch tools"></section>
        <nav id="rail" class="rail" hidden aria-label="Shortcuts"></nav>

        <nav id="steps" class="pill-row" aria-label="Pipeline steps"></nav>
        <button class="round-btn" data-action="labels" title="Show / hide labels" aria-label="Show or hide labels">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/><path d="M8.5 11h5"/></svg>
        </button>
      </div>
    </div>
    <div id="toast" class="pill pill-static" hidden></div>
  </main>
  <input id="context-file" type="file" accept="image/*" hidden>
  <section id="sheet" aria-hidden="true"></section>   <!-- the FF&E schedule as a page for paper; filled only while printing -->
  <input id="file" type="file" accept="image/*" hidden>
  <script src="sofa-matcher.js"></script>
  <script src="brief-engine.js"></script>
  <script src="layout-engine.js"></script>
  <script src="designer.js"></script>
  <script src="sofa-ui.js"></script>
  <script src="shop-layout.js"></script>
  <script src="shop-products.js"></script>
  <script src="shop-room.js"></script>
  <script src="variants.js"></script>
  <script src="needs-swipe.js"></script>
  <script src="app.js"></script>
  <script src="docked-chat.js"></script>
  <script src="design-workflow.js"></script>
  <script src="sketch.js"></script>
  <script src="intro.js"></script>
  <script src="walkthrough.js"></script>
</body>
</html>
